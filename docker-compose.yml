version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: koltto-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - koltto-network

  postgres:
    image: postgres:16-alpine
    container_name: koltto-postgres
    environment:
      POSTGRES_DB: koltto
      POSTGRES_USER: koltto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koltto_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koltto -d koltto"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - koltto-network

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  koltto-network:
    driver: bridge
